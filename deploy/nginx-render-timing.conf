# Load once in the http context (the existing sites/*.conf include does this).
# Query strings, cookies and authorization headers are deliberately omitted.
log_format render_timing escape=json
    '{"time":"$time_iso8601","host":"$host","method":"$request_method",'
    '"uri":"$uri","status":$status,"body_bytes":$body_bytes_sent,'
    '"request_bytes":$request_length,"request_seconds":$request_time,'
    '"connection_requests":$connection_requests,"cf_ray":"$http_cf_ray",'
    '"content_encoding":"$sent_http_content_encoding",'
    '"gzip_ratio":"$gzip_ratio"}';
